aid: mophones
name: Mophones
description: >-
  Mophones (MoPhones) is a Nairobi, Kenya based fintech and recommerce company building accessible
  device-financing and re-commerce infrastructure for Africa, starting with premium refurbished
  smartphones from brands like Apple and Samsung sold with flexible weekly-installment and
  pay-on-delivery plans. The consumer storefront runs on Shopify at mophones.co and does not expose
  a first-party developer API; its only programmatic surface is the Shopify-provided agentic-commerce
  layer — a published Universal Commerce Protocol (UCP) profile at /.well-known/ucp and a live
  UCP-over-MCP shopping endpoint at /api/ucp/mcp that lets buyer-approved AI shopping agents search
  the catalog, build carts, and complete Shop Pay checkouts. Mophones is backed by Speedinvest and
  was noted as the first African startup to secure NICE financing from STV.
